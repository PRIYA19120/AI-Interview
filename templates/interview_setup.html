<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Up Your Interview - InterviewAI</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f3ff, #ede9fe, #f3e8ff);
            min-height: 100vh;
            color: #1e1b4b;
        }

        .navbar {
            width: 100%;
            background: white;
            padding: 14px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 10px rgba(0,0,0,.05);
        }

        .logo {
            text-decoration: none;
            color: #1e1b4b;
            font-size: 20px;
            font-weight: 700;
        }

        .login {
            background: #4f46e5;
            color: white;
            text-decoration: none;
            padding: 9px 20px;
            border-radius: 8px;
            font-size: 13px;
        }

        .wrapper {
            max-width: 900px;
            margin: 45px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 45px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(79,70,229,.12);
        }

        .heading {
            text-align: center;
            margin-bottom: 35px;
        }

        .heading h1 {
            font-size: 28px;
            color: #111827;
        }

        .heading p {
            color: #64748b;
            margin-top: 7px;
            font-size: 13px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section h3 {
            font-size: 15px;
            margin-bottom: 15px;
            color: #1e293b;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .option {
            border: 2px solid #e5e7eb;
            border-radius: 15px;
            padding: 18px;
            cursor: pointer;
            transition: .2s;
        }

        .option:hover {
            border-color: #6366f1;
            transform: translateY(-2px);
        }

        .option input {
            margin-right: 8px;
            accent-color: #4f46e5;
        }

        .option strong {
            font-size: 14px;
        }

        .option p {
            font-size: 11px;
            color: #64748b;
            margin-top: 7px;
        }

        .start-area {
            text-align: center;
            margin-top: 35px;
        }

        .start-btn {
            border: none;
            background: #4f46e5;
            color: white;
            padding: 14px 40px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: .2s;
        }

        .start-btn:hover {
            background: #4338ca;
            transform: translateY(-2px);
        }

        @media(max-width:700px) {
            .options {
                grid-template-columns: 1fr;
            }

            .navbar {
                padding: 14px 20px;
            }

            .card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<header class="navbar">

    <a href="{{ url_for('home') }}" class="logo">
        🤖 InterviewAI
    </a>

    <a href="{{ url_for('login') }}" class="login">
        Login
    </a>

</header>


<div class="wrapper">

    <div class="card">

        <div class="heading">
            <h1>Set Up Your Interview</h1>
            <p>Choose your interview type, difficulty and number of questions.</p>
        </div>


        <form action="{{ url_for('interview') }}" method="GET">

            <!-- INTERVIEW TYPE -->

            <div class="section">

                <h3>1. Choose Interview Type</h3>

                <div class="options">

                    <label class="option">
                        <input type="radio"
                               name="interview_type"
                               value="HR"
                               checked>

                        <strong>💼 HR Interview</strong>

                        <p>
                            Behavioral and situational questions.
                        </p>
                    </label>


                    <label class="option">
                        <input type="radio"
                               name="interview_type"
                               value="Technical">

                        <strong>💻 Technical Interview</strong>

                        <p>
                            Programming and technical questions.
                        </p>
                    </label>


                    <label class="option">
                        <input type="radio"
                               name="interview_type"
                               value="General">

                        <strong>👥 General Interview</strong>

                        <p>
                            General and career-related questions.
                        </p>
                    </label>

                </div>

            </div>


            <!-- DIFFICULTY -->

            <div class="section">

                <h3>2. Choose Difficulty Level</h3>

                <div class="options">

                    <label class="option">

                        <input type="radio"
                               name="difficulty"
                               value="Beginner"
                               checked>

                        <strong>🌱 Beginner</strong>

                        <p>
                            Basic level questions.
                        </p>

                    </label>


                    <label class="option">

                        <input type="radio"
                               name="difficulty"
                               value="Intermediate">

                        <strong>📊 Intermediate</strong>

                        <p>
                            Moderate level questions.
                        </p>

                    </label>


                    <label class="option">

                        <input type="radio"
                               name="difficulty"
                               value="Advanced">

                        <strong>🚀 Advanced</strong>

                        <p>
                            Challenging interview questions.
                        </p>

                    </label>

                </div>

            </div>


            <!-- NUMBER OF QUESTIONS -->

            <div class="section">

                <h3>3. Number of Questions</h3>

                <div class="options">

                    <label class="option">

                        <input type="radio"
                               name="num_questions"
                               value="5"
                               checked>

                        <strong>5 Questions</strong>

                        <p>Short interview.</p>

                    </label>


                    <label class="option">

                        <input type="radio"
                               name="num_questions"
                               value="10">

                        <strong>10 Questions</strong>

                        <p>Standard interview.</p>

                    </label>


                    <label class="option">

                        <input type="radio"
                               name="num_questions"
                               value="15">

                        <strong>15 Questions</strong>

                        <p>Complete interview.</p>

                    </label>

                </div>

            </div>


            <div class="start-area">

                <button type="submit" class="start-btn">
                    🚀 Start Interview →
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
