<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - InterviewAI</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f7f9fd;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Centered Clean Card */
        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            padding: 40px 35px;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.06);
            border: 1px solid #edf2f7;
        }

        .logo-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-header a {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: inherit;
        }

        .logo-header i {
            font-size: 32px;
            color: #4f46e5;
        }

        .logo-header h3 {
            font-size: 20px;
            color: #111827;
            font-weight: 700;
            text-align: left;
            line-height: 1.1;
        }

        .logo-header span {
            display: block;
            font-size: 11px;
            color: #6b7280;
            font-weight: 500;
        }

        .form-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-header h2 {
            font-size: 22px;
            color: #111827;
            font-weight: 700;
        }

        .form-header p {
            font-size: 13px;
            color: #6b7280;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: #9ca3af;
            font-size: 14px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 40px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-wrapper input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            margin-bottom: 22px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #4b5563;
            cursor: pointer;
        }

        .forgot-link {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            background: #4338ca;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .btn-submit:hover {
            background: #3730a3;
            transform: translateY(-1px);
        }

        .card-footer {
            text-align: center;
            margin-top: 22px;
            font-size: 12px;
            color: #6b7280;
        }

        .card-footer a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }

        .card-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Logo on Top -->
        <div class="logo-header">
            <a href="{{ url_for('home') }}">
                <i class="fa-solid fa-brain"></i>
                <div>
                    <h3>InterviewAI</h3>
                    <span>Skill Analyzer</span>
                </div>
            </a>
        </div>

        <!-- Heading -->
        <div class="form-header">
            <h2>Welcome Back</h2>
            <p>Enter your details to access your account</p>
        </div>

        <!-- Form -->
        <form action="{{ url_for('login') }}" method="POST">
            <!-- Email -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="email" name="email" placeholder="name@example.com" required>
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
            </div>

            <!-- Checkbox & Forgot -->
            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" name="remember"> Remember me
                </label>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <!-- Button -->
            <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <div class="card-footer">
            Don't have an account? <a href="#">Sign up</a> <br><br>
            <a href="{{ url_for('home') }}"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
        </div>
    </div>

</body>
</html>
